5\" value=\"58\"><button id=\"tuneClose\">收起调整<\/button><\/div>\n<div id=\"paused\" role=\"dialog\" aria-label=\"投篮已暂停\"><div class=\"resumeCard\"><strong>投篮已暂停<\/strong><p>准备好了，就继续吧！<\/p><button id=\"resumeShoot\" class=\"primary\">▶ 继续投篮 / Resume<\/button><\/div><\/div>\n<div class=\"bottom glass\"><div class=\"powerTitle\"><span>力度 <b id=\"powerLabel\">0%<\/b><\/span><span id=\"powerHelp\">5秒循环 · 根据距离判断力度<\/span><\/div><div class=\"power\"><div id=\"fill\" class=\"fill\"><\/div><div id=\"powerCursor\"><\/div><\/div><div id=\"status\" role=\"status\" aria-live=\"polite\"><\/div><div class=\"row mainActions\"><button id=\"ready\" class=\"primary\">① 准备<\/button><button id=\"shoot\" class=\"primary\" disabled>② 投篮<\/button><button id=\"cancel\" disabled>重新瞄准<\/button><button id=\"next\" class=\"primary\" hidden>下一球 →<\/button><button id=\"newRound\" class=\"primary\" hidden>再玩一轮 →<\/button><\/div><\/div>\n<div id=\"handCursor\" hidden><div class=\"palm\"><svg aria-label=\"手掌光标\" viewBox=\"0 0 26 28\" width=\"38\" height=\"38\" fill=\"#fff0cf\"><rect x=\"6\" y=\"6\" width=\"4\" height=\"13\" rx=\"2\"/><rect x=\"10\" y=\"2\" width=\"4\" height=\"16\" rx=\"2\"/><rect x=\"14\" y=\"3\" width=\"4\" height=\"15\" rx=\"2\"/><rect x=\"18\" y=\"7\" width=\"4\" height=\"13\" rx=\"2\"/><rect x=\"6\" y=\"12\" width=\"16\" height=\"14\" rx=\"6\"/><path d=\"M8 16 4 11Q2 9 1 12L5 21 10 24Z\"/><\/svg><\/div><\/div><div id=\"toast\" hidden><\/div>\n<div id=\"overlay\" hidden><div class=\"dialog\"><h2 id=\"helpTitle\"><\/h2><p id=\"helpText\"><\/p><div id=\"recordPanel\" hidden><div id=\"history\"><\/div><p>累计获得 ★ <span id=\"earned\">0<\/span><\/p><p id=\"saveNote\"><\/p><div class=\"row\"><button id=\"export\">下载记录<\/button><button id=\"clear\" hidden disabled>清空记录<\/button><button id=\"tutorial\">教学两球<\/button><\/div><\/div><div class=\"row\"><button id=\"helpPrev\">上一页<\/button><button id=\"helpNext\">下一页<\/button><button id=\"helpClose\" class=\"primary\">返回球场<\/button><\/div><\/div><\/div><\/div>\n<script>\n'use strict';\nconst SHOOT_ART={\"school-far\": \"./shoot-assets/school-far.webp\", \"star\": \"./shoot-assets/star.webp\", \"school-near\": \"./shoot-assets/school-near.webp\", \"sunset\": \"./shoot-assets/sunset.webp\", \"coast\": \"./shoot-assets/coast.webp\", \"flash\": \"./shoot-assets/flash.webp\", \"release\": \"./shoot-assets/release.webp\", \"ball\": \"./shoot-assets/ball.webp\", \"hold\": \"./shoot-assets/hold.webp\", \"night\": \"./shoot-assets/night.webp\", \"board\": \"./shoot-assets/board.webp\", \"stand\": \"./shoot-assets/stand.webp\"};\nconst $=id=>document.getElementById(id), KEY='basketball-main-unused';\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nlet initial={version:1,round:[],rounds:[],stars:0,earned:0,best:0,distance:'near',dir:0,arc:58,spot:null,spotHistory:[],scene:0,phase:'aim',charge:0,ball:null,tutorial:0,tutorialShots:0,message:'观察新的站位与距离，重新瞄准后再准备投篮。'};\nlet s={...structuredClone(initial),...(parent.GameBridge.get().shootState||{})};s.stars=parent.GameBridge.get().wallet;\nlet mode='screen',paused=false,source='screen',last=0,acc=0,stream=null,pose=null,loading=false,camSession=0,calibration=null,latest=null,tracked=false,lastPoseTime=0,stable=0,lowered=false,baseline=null,previousHands=null,preview=true,calTime=0,lastGood=null,readyAt=0,loadWatch=null;\nlet panelOpen=false,helpPage=0,clearPending=false,uiActive=false;\nlet gesture={target:null,since:0,fired:false,hand:null,x:null,y:null,entered:0,last:0,cooldown:0};\nconst HELP=[\n['玩法 / How to play','Drag to aim. Press Ready, watch the power bar, then Shoot. Near: 2 points + 1 star. Far: 3 points + 3 stars.\\n\\n24个站位走完一轮前不重复，近投和远投交替，每球更换投篮角度。每球随机切换球场背景，可一直继续训练。 / Each new shot has a random court. Keep training for as long as you like.\\n拖动球场或双手移动瞄准，准备后观察力量条出手。方向蓝圈不是保证命中的落点。\\n近投命中2分＋1星；远投3分＋3星。星星不计入阅读分。'],\n['体感 / Motion controls','Keep shoulders and both hands visible. Hold hands at chest level for 1 second to calibrate. Step back until both hands remain visible when moved sideways and raised; then calibrate again if you change your position. Raise both hands and hold to charge, then extend upward to shoot. Lower hands after each shot.\\n\\n先后退一点，确认肩膀和双手左右移动、举高时都完整入镜；站稳后，双手放在胸前稳定1秒完成校准。换站位后请重新校准。左右、上下移手瞄准。\\n双手举至肩上停稳，开始蓄力；再向上伸手出手。每球结束后将双手放回胸前。\\n若手掌光标出现，表示当前是一只手在操作菜单。'],\n['手掌按钮 / Hand cursor','Lower one hand. Keep the other near chest level to point; lower it slightly to reach the bottom buttons; hold over a button for 1 second to click. Move away to reset.\\n\\n放低一只手，另一只手留在胸前或抬起，出现 ✋ 光标。任意一只手都可以。\\n控制的手稍微下移，就能移到屏幕底部按钮；不必把手降到腰部。把光标移到按钮上，停留1秒；圆环转满即点击。移开可取消，再次点击需先移开。\\n双手持球时隐藏光标。识别丢失时取消停留。'],\n['全屏 / Fullscreen','Click Fullscreen with a mouse or touch. Allow camera access manually. You may enter fullscreen before or after enabling the camera.\\n\\n用鼠标或触屏点击“进入全屏”；允许摄像头前后都可以操作。浏览器的权限弹窗需要手动确认。\\n之后可用手掌操作下一球、准备、投篮和其他游戏按钮。\\n单文件体感首次需联网。含模型压缩包通过本地启动或HTTPS网页可直接使用附带模型。'],\n['试玩记录','教学两球不发奖励。已开始的一轮需要先完成，才能重新进入教学。\\n本版为玩法测试，不接入全年级排名。摄像头画面只在本机处理，不上传、不录像。']];\nfunction showToast(msg){$('toast').textContent=msg;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2600)}\nfunction showHelp(){const [title,body]=HELP[helpPage];$('helpTitle').textContent=`${title} · ${helpPage+1}/${HELP.length}`;$('helpText').textContent=body;let diagram=$('helpDiagram');if(!diagram){diagram=document.createElement('div');diagram.id='helpDiagram';$('helpText').before(diagram)}diagram.textContent=['↔ 瞄准 Aim → ▰ 蓄力 Charge → ↗ 投篮 Shoot','胸前 ◯ → 双手 ↑ → 伸手 ↗\\nCalibrate → Raise & hold → Extend to shoot','✋ → ◎ 1秒 / Hold for 1 second','⛶ → 📷 允许 / Allow camera','★ 阅读提示 / Reading hints'][helpPage];$('helpPrev').disabled=helpPage===0;$('helpNext').disabled=helpPage===HELP.length-1;$('recordPanel').hidden=helpPage!==4;}\nfunction openPanel(){panelOpen=true;stable=0;baseline=null;$('overlay').hidden=false;showHelp()}\nfunction closePanel(){panelOpen=false;clearPending=false;$('clear').textContent='清空记录';$('overlay').hidden=true;stable=0;baseline=null;previousHands=null;renderUI()}\n$('help').onclick=()=>{helpPage=0;openPanel()};$('helpClose').onclick=closePanel;\n$('helpPrev').onclick=()=>{helpPage=Math.max(0,helpPage-1);showHelp()};$('helpNext').onclick=()=>{helpPage=Math.min(HELP.length-1,helpPage+1);showHelp()};\n$('tuneOpen').onclick=()=>{$('tuning').hidden=!$('tuning').hidden};$('tuneClose').onclick=()=>{$('tuning').hidden=true};\n$('fullscreen').onclick=async e=>{try{if(!e.isTrusted){showToast('请用鼠标或触屏点击全屏 / Click fullscreen directly.');return}await parent.GameBridge.fullscreen();$('fullscreen').textContent=parent.GameBridge.isFullscreen()?'退出全屏':'进入全屏'}catch(err){showToast('请用鼠标或触屏再次点击全屏按钮。')}};\nparent.document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=parent.GameBridge.isFullscreen()?'退出全屏':'进入全屏'});\n// Restore the original gain and smoothing; camera-edge proximity must not amplify aiming.\nfunction resetGesture(){if(gesture.target)gesture.target.classList.remove('gestureHover');gesture.target=null;gesture.since=0;gesture.fired=false;gesture.hand=null;gesture.x=null;gesture.y=null;gesture.entered=0;$('handCursor').hidden=true;$('handCursor').style.setProperty('--progress','0deg');}\nfunction routeHandCursor(x,y,now,hand){\nif(document.hidden){resetGesture();return}\nif(gesture.hand!==hand||now-gesture.last>350){resetGesture();gesture.hand=hand;gesture.entered=now;gesture.x=x;gesture.y=y;}\ngesture.last=now;gesture.x+=(x-gesture.x)*.48;gesture.y+=(y-gesture.y)*.48;\nconst cursor=$('handCursor');cursor.hidden=false;cursor.style.left=gesture.x+'px';cursor.style.top=gesture.y+'px';\nconst target=document.elementFromPoint(gesture.x,gesture.y)?.closest('button');\nconst valid=target&&!target.disabled&&!target.hidden&&$('app').contains(target)&&target.getClientRects().length;\nif(!valid||target!==gesture.target){if(gesture.target)gesture.target.classList.remove('gestureHover');gesture.target=valid?target:null;gesture.since=now;gesture.fired=false;cursor.style.setProperty('--progress','0deg');}\nif(!gesture.target||now-gesture.entered<220||now<gesture.cooldown)return;\ngesture.target.classList.add('gestureHover');const progress=clamp((now-gesture.since)/1000,0,1);cursor.style.setProperty('--progress',progress*360+'deg');\nif(progress>=1&&!gesture.fired){const button=gesture.target;gesture.fired=true;gesture.cooldown=now+650;\nif(button.id==='ready')prepare('motion');else if(button.id==='shoot')shoot('screen');else button.click();\n}\n}\n\nfunction save(){parent.GameBridge.saveShoot(s);$('saveNote').textContent='投篮与阅读进度共同保存。';}\nfunction say(t){s.message=t;$('status').textContent=t}\nfunction frozen(){return paused||panelOpen||document.hidden||(mode==='motion'&&s.phase==='charge'&&uiActive)||(mode==='motion'&&source==='motion'&&s.phase==='charge'&&(!tracked||performance.now()-lastPoseTime>400))}\nfunction renderUI(){document.querySelector('.sceneInfo').classList.toggle('cueLeft',hoopX()>0);let count=s.tutorial?s.tutorialShots:s.round.length;$('round').textContent=s.tutorial?`教学 ${count}/2 球`:`本轮 ${count}/5 球`;$('score').textContent=s.round.reduce((a,b)=>a+b.points,0);$('best').textContent=s.best;$('stars').textContent=s.stars;$('earned').textContent=s.earned;$('status').textContent=s.message;$('near').classList.toggle('active',s.distance==='near');$('far').classList.toggle('active',s.distance==='far');$('distanceKind').textContent=s.distance==='near'?'近投':'远投';$('distanceMeter').textContent=Math.hypot(s.spot?.x||0,distance()).toFixed(1)+' 米';$('reward').textContent=s.distance==='near'?'命中 2分 · ＋1★':'命中 3分 · ＋3★';$('direction').value=s.dir;$('arc').value=s.arc;$('dirLabel').textContent=s.dir.toFixed(1)+'°';$('arcLabel').textContent=s.arc.toFixed(0)+'°';let lock=s.phase!=='aim'||paused;for(let id of ['direction','arc','left','right','center'])$(id).disabled=lock;$('ready').disabled=s.phase!=='aim'||paused;$('shoot').disabled=s.phase!=='charge'||paused;$('cancel').disabled=s.phase!=='charge'||paused;$('next').hidden=s.phase!=='result';$('newRou async function animateJourney(from,to){

  await ball.animate(frames,{duration:1900,easing:'ease-in-out',fill:'forwards'}).finished;

  ball.getAnimations().forEach(a=>a.cancel());ballAt(target);
  window.BasketballSFX?.play('unlock',{group:'celebration',volume:.85,duck:true});lock.textContent='🔓';
  lock.animate([{transform:'translate(-50%,-50%) scale(1.3)',opacity:1},{transform:'translate(-50%,-160%) rotate(-30deg) scale(1.8)',opacity:0}],{duration:850,fill:'forwards'}).finished.then(()=>lock.remove()).catch(()=>lock.remove());
  journeySeen=step+1;STAGES.forEach((_,i)=>journeyUpdateStage(i,journeySeen));$('journeyPath'+step).classList.add('lit');
  $('journeyToast').textContent='🔓 '+STAGES[target]+' 已解锁！点击关卡继续挑战';
  ball.animate([{transform:'translate(-50%,-155%) scale(1.2)'},{transform:'translate(-50%,-240%) scale(1.1)'},{transform:'translate(-50%,-155%) scale(1)'}],{duration:700,easing:'ease-out'});

function cloudRead(params){return new Promise((resolve,reject)=>{
 const callback='bbcb_'+crypto.randomUUID().replaceAll('-',''),script=document.createElement('script'),url=new URL(LEADERBOARD_CONFIG.endpoint);let done=false;
 const finish=(err,result)=>{if(done)return;done=true;clearTimeout(timer);script.remove();delete window[callback];err?reject(err):resolve(result)};

async function cloudRPC(payload){
 payload={gameId:LEADERBOARD_CONFIG.gameId,season:LEADERBOARD_CONFIG.season,...payload};payload.requestId??=crypto.randomUUID();

function cloudRestoreFirst(firstItems){

async function cloudLogin(profile,local){

  if(meta?.pendingRequest)meta.pendingRequest.token=useToken;

  if(localPending&&meta.pendingRequest&&result.snapshot&&result.revision===meta.pendingRequest.baseRevision+1&&JSON.stringify(result.snapshot)===JSON.stringify(meta.pendingRequest.snapshot)){
   meta.revision=result.revision;delete meta.pendingRequest;

   state=local;state.profile=profile;cloudMeta().token=useToken;cloudConflict=true;accountGate=false;paused=true;

  }

  else cloudAdopt(result,local,profile,useToken);

// Certificate artwork is kept external; personalised fields are rendered at export time.
let certificateBusy=false,certificatePreviewURL=null;
async function certificateCanvas(c){
 const img=new Image();img.src='./growth-assets/certificate-template.png';await img.decode();
 await document.fonts.ready;
 const canvas=document.createElement('canvas');canvas.width=img.naturalWidth*2;canvas.height=img.naturalHeight*2;
 const ctx=canvas.getContext('2d');ctx.scale(canvas.width/1491,canvas.height/1055);ctx.drawImage(img,0,0,1491,1055);
 ctx.fillStyle='#082747';ctx.textAlign='center';ctx.textBaseline='alphabetic';
 function field(text,x,y,width,size){
  text=String(text);ctx.font=`700 ${size}px "Microsoft YaHei","PingFang SC",system-ui,sans-serif`;
  while(ctx.measureText(text).width>width&&size>12){size--;ctx.font=`700 ${size}px "Microsoft YaHei","PingFang SC",system-ui,sans-serif`}
  ctx.fillText(text,x,y,width);
 }
 field(c.name,543,369,535,38);field(c.class,1043,369,170,34);
 field(c.code,551,587,310,23);field(c.date,1073,587,290,28);
 return canvas;
}
async function openCertificate(){
 if(certificateBusy)return;
 if(playerRank()!==5){showModal('入队证书尚未解锁','完成全部31项阅读任务，并达到310 XP，即可领取专属证书。');return}
 const meta=cloudMeta();
 if(meta.localOnly||!meta.token){showModal('连接云端后领取证书','请用相同的玩家昵称登录教师试玩云端，保存进度后再领取。');return}
 if(cloudConflict)return;
 certificateBusy=true;const owner=profileKey(state.profile);
 showModal('正在准备你的入队证书','正在确认云端成绩，请稍候…',[]);
 try{
  // A save may finish an older queued snapshot. Flush the current one as well.
  for(let i=0;i<3;i++){const saved=await saveCloud(true);if(cloudConflict)return;if(!saved.pending&&!cloudMeta().dirty)break}
  if(cloudMeta().dirty)throw Error('NETWORK');
  const result=await cloudRPC({action:'certificate',name:state.profile.name,class:state.profile.class,token:meta.token});
  if(profileKey(state.profile)!==owner)return;
  const c=result.certificate;
  if(!c||!c.code||!/^\d{4}-\d{2}-\d{2}$/.test(c.date))throw Error('INVALID_REQUEST');
  const canvas=await certificateCanvas(c);
  const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('EXPORT_FAILED')),'image/png'));
  if(profileKey(state.profile)!==owner)return;
  if(certificatePreviewURL)URL.revokeObjectURL(certificatePreviewURL);
  const url=URL.createObjectURL(blob);certificatePreviewURL=url;
  showModal('你的正式入队证书 · Team Certificate','',[]);
  document.querySelector('#modal .dialog').classList.add('certificateDialog');
  const preview=document.createElement('img');preview.src=url;preview.alt=`${c.name}的阅读挑战完成暨正式入队证书`;
  preview.style.cssText='display:block;width:100%;height:auto;border-radius:8px';$('modalText').append(preview);
  const note=document.createElement('p');note.textContent='证书编号与日期已保存，再次领取或换电脑下载都保持一致。';note.style.cssText='font-size:14px;text-align:center';$('modalText').append(note);
  const download=document.createElement('a');download.className='primary certificateDownload';download.textContent='下载证书 PNG';download.href=url;
  download.download='篮球小子_入队证书_'+c.name.replace(/[\\/:*?"<>|]/g,'_')+'.png';
  $('modalButtons').append(download,btn('返回成绩与排行榜',()=>{closeModal();summary()}));
 }catch(e){
  if(cloudConflict)return;
  const message=(e.code||e.message)==='NOT_ELIGIBLE'?'云端记录尚未达到入队条件，请先完成全部任务并同步310 XP。':e.message==='EXPORT_FAILED'?'证书图片暂时未能生成，请重试。':cloudErrorText(e);
  showModal('证书暂未生成',message,[['重试',openCertificate],['返回',closeModal]]);
 }finally{certificateBusy=false}
}

const GAME_MUSIC={"shooting": "./audio/bgm-shooting.mp3", "map": "./audio/bgm-map.mp3", "reading": "./audio/bgm-reading.mp3", "opening": "./audio/bgm-opening.mp3"};
// One shared music player across the reading game and the shooting iframe.
const gameMusic=(()=>{
 const player=new Audio();player.id='gameBGM';player.loop=true;player.preload='metadata';player.setAttribute('playsinline','');player.hidden=true;document.body.append(player);
 let current='',intro=true,queued=false,playingRequest=null;
 const levels={opening:.30,map:.27,reading:.20,shooting:.25};
 function desired(){
  if(document.getElementById('artOpening')||accountGate||state.location.view==='home'){intro=true;return 'opening'}
  if(!$('shootLayer').hidden)return 'shooting';
  if(intro&&tutorialSession)return 'opening';
  intro=false;return state.location.view==='task'?'reading':'map';
 }
 function play(){
  if(document.hidden||!player.paused||playingRequest)return;
  const request=player.play();playingRequest=request;
  request.catch(()=>{}).finally(()=>{if(playingRequest===request)playingRequest=null});
 }
 function sync(){
  queued=false;const next=desired();
  if(next!==current){player.pause();playingRequest=null;current=next;player.dataset.track=next;player.src=GAME_MUSIC[next];player.load()}
  // Keep level-up and welcome sounds audible above the background music.
  player.volume=levels[next]*((growthOverlay?.isConnected||window.BasketballSFX?.ducking)? .25:1);
  if(document.hidden)player.pause();else play();
 }

 ['pointerdown','click','keydown'].forEach(type=>document.addEventListener(type,gesture,{capture:true,passive:true}));
 document.addEventListener('visibilitychange',sync);

 window.addEventListener('pagehide',()=>player.pause());window.addEventListener('pageshow',schedule);
 const observer=new MutationObserver(()=>{
  const frame=$('shootFrame');if(frame&&!frame.dataset.musicBound){frame.dataset.musicBound='1';frame.addEventListener('load',()=>{try{['pointerdown','click','keydown'].forEach(type=>frame.contentDocument.addEventListener(type,gesture,{capture:true,passive:true}))}catch{};schedule()})}
  schedule();
 });
 observer.observe($('app'),{childList:true});observer.observe($('shootLayer'),{childList:true,attributes:true,attributeFilter:['hidden']});
 const priorRender=render;render=function(...args){const result=priorRender(...args);schedule();return result};
 const priorTask=renderTask;renderTask=function(...args){const result=priorTask(...args);schedule();return result};
 schedule();return {player,sync};
})();

const GAME_SFX={"three-stars": "./audio/sfx/three-stars.mp3", "one-star": "./audio/sfx/one-star.mp3", "floor": "./audio/sfx/floor.mp3", "level-up": "./audio/sfx/level-up.mp3", "unlock": "./audio/sfx/unlock.mp3", "release": "./audio/sfx/release.mp3", "welcome": "./audio/sfx/welcome.mp3", "win": "./audio/sfx/win.mp3", "exchange": "./audio/sfx/exchange.mp3", "badge": "./audio/sfx/badge.mp3", "card": "./audio/sfx/card.mp3", "basket": "./audio/sfx/basket.mp3", "button": "./audio/sfx/button.mp3"};
// User-provided effects. Playback never changes scores, physics or save data.
const gameSFX=(()=>{
 const voices=new Set(),timers=new Set();
 function notify(){window.dispatchEvent(new Event('game-audio-mix'))}
 function stopGroup(group){for(const v of [...voices])if(!group||v.group===group)v.stop();for(const t of [...timers])if(!group||t.group===group){clearTimeout(t.id);timers.delete(t)}}

  if(delay){let stopPlayback;const t={group,id:setTimeout(()=>{timers.delete(t);stopPlayback=play(key,{group,volume,duck})},delay)};timers.add(t);return ()=>{clearTimeout(t.id);timers.delete(t);stopPlayback?.()}}
  if(!GAME_SFX[key]||document.hidden)return ()=>{};
  if(group==='celebration'){stopGroup('celebration');stopGroup('feedback')}
  if(group==='feedback')stopGroup('feedback');
  if(voices.size>=6)[...voices][0].stop();
  const audio=new Audio(GAME_SFX[key]);audio.volume=volume;audio.dataset.effect=key;
  const v={audio,group,duck,stop(){audio.pause();audio.removeAttribute('src');voices.delete(v);notify()}};
  audio.onended=v.stop;audio.onerror=v.stop;voices.add(v);notify();audio.play().catch(v.stop);return v.stop;
 }
 document.addEventListener('visibilitychange',()=>{if(document.hidden)stopGroup()});window.addEventListener('pagehide',()=>stopGroup());
 return {play,stopGroup,get ducking(){return [...voices].some(v=>v.duck)},get active(){return [...voices].map(v=>({key:v.audio.dataset.effect,paused:v.audio.paused}))}};
})();

function startCelebrationCanvas(layer){

 let w=0,h=0,particles=[],raf=0,last=0,nextBurst=0,alive=true;
 function resize(){const box=layer.getBoundingClientRect();w=box.width;h=box.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}

  for(let i=0;i<(reduced?12:35);i++){const angle=Math.random()*Math.PI*2,speed=70+Math.random()*160;particles.push({x:w*(.25+Math.random()*.5),y:h*.27,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,age:0,life:1.2,color:colors[i%5],spin:0,angle:0,size:3,spark:true})}}
 function frame(t){if(!alive||!layer.isConnected)return;const dt=Math.min((t-(last||t))/1000,.04);last=t;if(t>=nextBurst){burst();nextBurst=t+(reduced?2400:1800)}ctx.clearRect(0,0,w,h);
 particles=particles.filter(p=>p.age<p.life&&p.y<h+30);for(const p of particles){p.age+=dt;p.vy+=h*.34*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.angle+=p.spin*dt;ctx.save();ctx.globalAlpha=Math.min(1,(p.life-p.age)*1.5);ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;if(p.spark){ctx.beginPath();ctx.arc(0,0,p.size,0,7);ctx.fill()}else ctx.fillRect(-p.size/2,-p.size/3,p.size,Math.max(2,p.size*.6*Math.abs(Math.cos(p.age*5))));ctx.restore()}canvas.dataset.frame=String(t);raf=requestAnimationFrame(frame)}

}
